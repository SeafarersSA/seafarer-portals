<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="Seafarer Portal"/>
    <meta name="theme-color" content="#1A2B5C"/>
    <title>Seafarer Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent
    }

    :root {
        --navy: #1A2B5C;
        --red: #C0392B;
        --gold: #E8B84B;
        --s0: #F0F2F8;
        --s1: #E8ECF5;
        --s2: #fff;
        --bdr: #D0D8ED;
        --bdrS: #B0BEDC;
        --tp: #1a1a2e;
        --ts: #4A5568;
        --tm: #8A96AA;
        --tsu: #2D6A2D;
        --ta: #185FA5;
        --tw: #854F0B;
        --td: #A32D2D;
        --bsu: #EAF3DE;
        --ba: #EEF2FB;
        --bw: #FAEEDA;
        --bd: #FCEBEB;
        --bdsu: #B5D4A0;
        --bda: #B5D4F4;
        --bdw: #F4C775;
        --bdd: #F4A0A0;
        --fsu: #639922;
        --fa: #378ADD;
        --radius: 8px;
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
        font-family: var(--font);
        background: var(--s0);
        color: var(--tp);
        min-height: 100vh
    }

    .hide {
        display: none !important
    }

    #login-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: linear-gradient(160deg, #0F1D3C 0%, #1A2B5C 60%, #1C3A7A 100%)
    }

    .lcard {
        background: #fff;
        border-radius: 20px;
        padding: 32px 28px;
        width: 100%;
        max-width: 340px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .3)
    }

    .llogo {
        text-align: center;
        margin-bottom: 22px
    }

    .llogo img {
        width: 180px;
        height: auto
    }

    .ltitle {
        font-size: 17px;
        font-weight: 600;
        text-align: center;
        color: var(--navy);
        margin-bottom: 3px
    }

    .lsub {
        font-size: 13px;
        color: var(--ts);
        text-align: center;
        margin-bottom: 18px
    }

    .rtabs {
        display: flex;
        gap: 6px;
        background: var(--s0);
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 16px
    }

    .rtab {
        flex: 1;
        padding: 8px;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 500;
        border: none;
        background: transparent;
        color: var(--ts);
        cursor: pointer;
        font-family: var(--font)
    }

    .rtab.active {
        background: #fff;
        color: var(--navy);
        box-shadow: 0 1px 4px rgba(0, 0, 0, .12)
    }

    .fld {
        margin-bottom: 13px
    }

    .fld label {
        font-size: 12px;
        font-weight: 500;
        color: var(--ts);
        display: block;
        margin-bottom: 4px
    }

    .fld input {
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1.5px solid var(--bdr);
        background: #fff;
        color: var(--tp);
        font-size: 14px;
        font-family: var(--font);
        outline: none
    }

    .fld input:focus {
        border-color: var(--navy)
    }

    .lbtn {
        width: 100%;
        padding: 13px;
        background: var(--navy);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: var(--font);
        margin-top: 4px
    }

    .lbtn:active {
        background: #0F1D3C
    }

    .lerr {
        font-size: 12px;
        color: var(--td);
        text-align: center;
        margin-bottom: 10px;
        display: none
    }

    .lhint {
        font-size: 11px;
        color: var(--tm);
        text-align: center;
        margin-top: 14px;
        line-height: 1.6
    }

    #portal {
        display: none;
        flex-direction: column;
        min-height: 100vh
    }

    .topbar {
        background: #fff;
        border-bottom: 1px solid var(--bdr);
        padding: 0 16px;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100
    }

    .topbar img {
        height: 30px;
        width: auto
    }

    .tu {
        display: flex;
        align-items: center;
        gap: 8px
    }

    .uav {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--red);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center
    }

    .unm {
        font-size: 12px;
        font-weight: 500;
        color: var(--ts);
        max-width: 80px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap
    }

    .sobtn {
        font-size: 11px;
        color: var(--tm);
        background: none;
        border: .5px solid var(--bdr);
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
        font-family: var(--font)
    }

    .main {
        flex: 1;
        padding: 16px;
        padding-bottom: 80px
    }

    .view {
        display:none
    }

    .view.active {
        display: block
    }

    .ptitle {
        font-size: 17px;
        font-weight: 600;
        margin-bottom: 2px
    }

    .psub {
        font-size: 12px;
        color: var(--ts);
        margin-bottom: 16px
    }

    .bnav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 1px solid var(--bdr);
        display: flex;
        padding: 6px 0;
        z-index: 100
    }

    .nbtn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 5px 0;
        background: none;
        border: none;
        cursor: pointer;
        font-family: var(--font);
        color: var(--tm);
        font-size: 10px
    }

    .nbtn.active {
        color: var(--navy)
    }

    .nbtn i {
        font-size: 20px
    }

    .card {
        background: #fff;
        border: 1px solid var(--bdr);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 10px
    }

    .sgrid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 14px
    }

    .sc {
        background: #fff;
        border: 1px solid var(--bdr);
        border-radius: 12px;
        padding: 12px
    }

    .slbl {
        font-size: 11px;
        color: var(--tm);
        margin-bottom: 3px
    }

    .sval {
        font-size: 22px;
        font-weight: 600
    }

    .sval.g {
        color:var(--fsu)
    }

    .sval.b {
        color:var(--fa)
    }

    .sval.a {
        color: #BA7517
    }

    .nbox {
        background: var(--navy);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
        position: relative;
        overflow: hidden
    }

    .nbox::after {
        content: '⚓';
        position: absolute;
        right: 12px;
        top: 6px;
        font-size: 42px;
        opacity: .07;
        pointer-events: none
    }

    .nlbl {
        font-size: 10px;
        color: var(--gold);
        font-weight: 600;
        letter-spacing: .8px;
        margin-bottom: 5px
    }

    .ntitle {
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        margin-bottom: 3px
    }

    .nsub {
        font-size: 12px;
        color: rgba(255, 255, 255, .6);
        margin-bottom: 12px
    }

    .nbtn2 {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, .15);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        font-family: var(--font)
    }

    .pb {
        height: 6px;
        background: var(--s0);
        border-radius: 3px;
        overflow: hidden;
        margin: 5px 0
    }

    .pf {
        height: 100%;
        border-radius: 3px;
        background:var(--fa)
    }

    .pf.g {
        background: var(--fsu)
    }

    .bdg {
        font-size: 10px;
        padding: 3px 9px;
        border-radius: 20px;
        font-weight: 600;
        white-space: nowrap;
        display: inline-block
    }

    .bdg-done {
        background: var(--bsu);
        color:var(--tsu)
    }

    .bdg-active {
        background: var(--ba);
        color:var(--ta)
    }

    .bdg-booked {
        background: var(--bw);
        color:var(--tw)
    }

    .bdg-pending {
        background: var(--s0);
        color: var(--tm);
        border: .5px solid var(--bdr)
    }

    .ci {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--s0)
    }

    .ci:last-child {
        border: none
    }

    .cicon {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 16px
    }

    .cicon.done {
        background: var(--bsu);
        color:var(--tsu)
    }

    .cicon.active {
        background: var(--ba);
        color:var(--ta)
    }

    .cicon.booked {
        background: var(--bw);
        color:var(--tw)
    }

    .cicon.pending {
        background: var(--s0);
        color: var(--tm)
    }

    .cinf {
        flex: 1;
        min-width: 0
    }

    .cnm {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
    }

    .cpr {
        font-size: 11px;
        color: var(--tm)
    }

    .crt {
        text-align: right;
        flex-shrink: 0
    }

    .cdt {
        font-size: 10px;
        color: var(--tm);
        margin-top: 3px
    }

    .vpipe {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 8px 0
    }

    .vdot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--bdrS);
        flex-shrink: 0
    }

    .vdot.done {
        background:var(--fsu)
    }

    .vdot.act {
        background: var(--navy)
    }

    .vline {
        flex: 1;
        height: 2px;
        background:var(--bdr)
    }

    .vline.done {
        background: var(--fsu)
    }

    .vstage {
        font-size: 12px;
        color: var(--ts);
        text-align: center;
        margin-top: 4px
    }

    .btn {
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--bdr);
        background: #fff;
        color: var(--tp);
        font-family: var(--font)
    }

    .btn.nv {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy)
    }

    .btn.gn {
        background: #25D366;
        color: #fff;
        border-color: #25D366
    }

    .btn.sm {
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 8px
    }

    .btn.full {
        width: 100%;
        display: block;
        text-align: center
    }

    .ltabs2 {
        display: flex;
        gap: 8px;
        margin-bottom: 14px
    }

    .ltab {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: 1.5px solid var(--bdr);
        background: #fff;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        font-family: var(--font);
        color: var(--ts);
        text-align: center
    }

    .ltab.active {
        border-color: var(--navy);
        background: var(--ba);
        color: var(--navy)
    }

    .crow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 0;
        border-bottom: 1px solid var(--s0)
    }

    .crow:last-child {
        border: none
    }

    .cprice {
        font-size: 13px;
        font-weight: 600;
        color: var(--red)
    }

    .sbar {
        display: flex;
        gap: 6px;
        margin-bottom: 14px
    }

    .sseg {
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: var(--bdr)
    }

    .sseg.done {
        background: var(--navy)
    }

    .slb {
        font-size: 10px;
        color: var(--tm);
        text-align: center;
        margin-top: 3px
    }

    .fg {
        margin-bottom: 13px
    }

    .fg label {
        font-size: 12px;
        font-weight: 500;
        color: var(--ts);
        display: block;
        margin-bottom: 4px
    }

    .fg input, .fg select, .fg textarea {
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1.5px solid var(--bdr);
        background: #fff;
        color: var(--tp);
        font-size: 14px;
        font-family: var(--font);
        outline: none
    }

    .fg input:focus, .fg select:focus, .fg textarea:focus {
        border-color: var(--navy)
    }

    .fg textarea {
        resize: vertical;
        min-height: 65px
    }

    .bbox {
        background: var(--ba);
        border: 1px solid var(--bda);
        border-left: 4px solid var(--navy);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px
    }

    .brow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px 0;
        border-bottom: .5px solid var(--bda);
        font-size: 13px
    }

    .brow:last-child {
        border: none
    }

    .blbl {
        color:var(--ts)
    }

    .bval {
        font-weight: 600;
        color: var(--navy);
        display: flex;
        align-items: center;
        gap: 6px
    }

    .cpbtn {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 6px;
        border: .5px solid var(--bda);
        background: #fff;
        cursor: pointer;
        color: var(--ta);
        font-family: var(--font)
    }

    .uzone {
        border: 2px dashed var(--bdrS);
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        cursor: pointer;
        background: var(--s0)
    }

    .uzone.ok {
        border-color: var(--fsu);
        background: var(--bsu)
    }

    .wbox {
        background: var(--bw);
        border: .5px solid var(--bdw);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 12px;
        color: var(--tw);
        margin-bottom: 12px
    }

    .sscrn {
        text-align: center;
        padding: 20px 0
    }

    .wabox {
        background: #e7f8ef;
        border: 1px solid #b5e8c8;
        border-radius: 12px;
        padding: 14px;
        margin: 12px 0
    }

    .watitle {
        font-size: 13px;
        font-weight: 600;
        color: #0d5c2d;
        margin-bottom: 4px
    }

    .wasub {
        font-size: 12px;
        color: #0d5c2d;
        margin-bottom: 10px;
        opacity: .85
    }

    .walink {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #25D366;
        color: #fff;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none
    }

    .qcard {
        background: #fff;
        border: 1px solid var(--bdr);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 10px
    }

    .qopt {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1.5px solid var(--bdr);
        margin-bottom: 8px;
        cursor: pointer;
        font-size: 13px;
        background: #fff
    }

    .qopt.sel {
        border-color: var(--fa);
        background: var(--ba);
        color: var(--ta)
    }

    .qopt.correct {
        border-color: var(--fsu);
        background: var(--bsu);
        color: var(--tsu)
    }

    .qopt.wrong {
        border-color: #E24B4A;
        background: var(--bd);
        color: var(--td)
    }

    .ocircle {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid currentColor;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 10px
    }

    .ditem {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--s0)
    }

    .ditem:last-child {
        border: none
    }

    .dicon {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        background: var(--ba);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: var(--ta);
        flex-shrink: 0
    }

    .tgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 16px
    }

    .tcard {
        padding: 14px;
        border-radius: 12px;
        border: 1.5px solid var(--bdr);
        background: #fff;
        cursor: pointer;
        text-align: center
    }

    .tcard.active {
        border-color: var(--navy);
        background: var(--ba)
    }

    .tcard i {
        font-size: 24px;
        color: var(--navy);
        display: block;
        margin-bottom: 6px
    }

    .tnm {
        font-size: 13px;
        font-weight:500
    }

    .tsb {
        font-size: 11px;
        color: var(--tm)
    }

    .cvpw {
        background: #fff;
        border: 1px solid var(--bdr);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 14px
    }

    .cvi {
        padding: 20px 22px;
        font-family: Georgia, serif;
        color: #111;
        font-size: 11.5px
    }

    .cvhdr {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2.5px solid #1A2B5C;
        padding-bottom: 12px;
        margin-bottom: 12px;
        gap: 12px
    }

    .cvnm {
        font-size: 19px;
        font-weight: 700;
        color: #1A2B5C;
        margin-bottom: 2px
    }

    .cvrl {
        font-size: 11px;
        color: #C0392B;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 6px
    }

    .cvct {
        display: flex;
        flex-wrap: wrap;
        gap: 3px 12px;
        font-size: 10px;
        color: #444
    }

    .cvsec {
        font-size: 9.5px;
        font-weight: 700;
        color: #1A2B5C;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border-bottom: 1px solid #1A2B5C;
        padding-bottom: 2px;
        margin: 10px 0 6px
    }

    .cvsk {
        font-size: 9.5px;
        background: #EEF2FB;
        color: #1A2B5C;
        padding: 2px 7px;
        border-radius: 10px;
        border: .5px solid #B5D4F4;
        display: inline-block;
        margin: 2px
    }

    .cvcer {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        padding: 3px 0;
        border-bottom: .5px solid #eee
    }

    .cvex {
        margin-bottom: 8px
    }

    .cvexh {
        display: flex;
        justify-content: space-between;
        align-items: baseline
    }

    .cvext {
        font-size: 11.5px;
        font-weight: 700;
        color: #111
    }

    .cvexd {
        font-size: 10px;
        color: #777;
        font-style: italic
    }

    .cvexc {
        font-size: 11px;
        color: #1A2B5C;
        font-weight: 600
    }

    .cvexp {
        font-size: 10px;
        color: #333;
        line-height: 1.5;
        margin-top: 2px
    }

    .cvft {
        margin-top: 10px;
        padding-top: 6px;
        border-top: .5px solid #ddd;
        text-align: center;
        font-size: 9px;
        color: #bbb
    }

    .srow {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid var(--s0)
    }

    .srow:last-child {
        border: none
    }

    .sav {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: 2px
    }

    .ppill {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 20px;
        display: inline-block
    }

    .rrow {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        align-items: center;
        padding: 7px 0;
        border-bottom: .5px solid var(--s0);
        font-size: 12px
    }

    .rrow:last-child {
        border: none
    }

    .shdr {
        font-size: 12px;
        font-weight: 600;
        color: var(--tp);
        margin: 14px 0 8px
    }

    .bbtn {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        color: var(--navy);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        font-family: var(--font);
        margin-bottom: 14px
    }

    .vubtn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 9px;
        border: 1px solid var(--bdr);
        background: #fff;
        cursor: pointer;
        font-size: 12px;
        font-family: var(--font);
        margin-bottom: 6px;
        width: 100%
    }

    .vubtn.av {
        border-color: var(--navy);
        background: var(--ba);
        font-weight: 500;
        color: var(--navy)
    }

    .vubtn.dv {
        border-color: var(--fsu);
        background: var(--bsu);
        color: var(--tsu)
    }

    .nta {
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1.5px solid var(--bdr);
        background: #fff;
        color: var(--tp);
        font-size: 13px;
        font-family: var(--font);
        resize: vertical;
        min-height: 80px;
        outline: none
    }

    .nta:focus {
        border-color: var(--navy)
    }

    .aqf {
        background: var(--s0);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px
    }

    .aqf input, .aqf textarea {
        width: 100%;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid var(--bdr);
        background: #fff;
        font-size: 13px;
        font-family: var(--font);
        margin-bottom: 8px;
        outline: none
    }

    .aqf textarea {
        resize: vertical;
        min-height: 55px
    }

    .errmsg {
        font-size: 11px;
        color: var(--td);
        display: none;
        margin-bottom: 8px
    }

    .svd {
        font-size: 11px;
        color: var(--tsu);
        text-align: right;
        display: none;
        margin-top: 4px
    }

    .empty {
        text-align: center;
        padding: 28px;
        color: var(--tm);
        font-size: 13px
    }

    .cal-wrap {
        background: #fff;
        border-radius: 12px;
        border: 1px solid var(--bdr);
        overflow: hidden;
        margin-bottom: 14px
    }

    .cal-hdr {
        background: #1A2B5C;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between
    }

    .cal-title {
        font-size: 15px;
        font-weight: 600;
        color: #fff
    }

    .cal-nav {
        display: flex;
        gap: 8px;
        align-items: center
    }

    .cal-nav button {
        background: rgba(255, 255, 255, .15);
        border: none;
        color: #fff;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font)
    }

    .cal-nav button:hover {
        background: rgba(255, 255, 255, .25)
    }

    .cal-today {
        font-size: 11px;
        padding: 4px 10px;
        background: rgba(255, 255, 255, .15);
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-family: var(--font)
    }

    .cal-days-hdr {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        background: #f0f2f8
    }

    .cal-day-lbl {
        text-align: center;
        padding: 6px 0;
        font-size: 10px;
        font-weight: 600;
        color: var(--ts);
        letter-spacing: .5px
    }

    .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 1px;
        background: var(--bdr)
    }

    .cal-cell {
        background: #fff;
        min-height: 52px;
        padding: 4px;
        cursor: pointer;
        position: relative
    }

    .cal-cell:hover {
        background: #f8f9fc
    }

    .cal-cell.other-month {
        background: #fafbfd
    }

    .cal-cell.today .cal-date {
        background: #1A2B5C;
        color: #fff;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600
    }

    .cal-cell.has-event {
        background: #fffdf5
    }

    .cal-date {
        font-size: 11px;
        font-weight: 500;
        color: var(--tp);
        margin-bottom: 2px;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center
    }

    .cal-cell.other-month .cal-date {
        color: var(--tm)
    }

    .cal-evt {
        font-size: 9px;
        font-weight: 600;
        padding: 1px 4px;
        border-radius: 3px;
        margin-bottom: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.4
    }

    .evt-stcw {
        background: #FAEEDA;
        color: #854F0B
    }

    .evt-rya {
        background: #EEF2FB;
        color: #185FA5
    }

    .evt-vhf {
        background: #EAF3DE;
        color: #3B6D11
    }

    .evt-awareness {
        background: #F5EDFB;
        color: #6B21A8
    }

    .evt-pwc {
        background: #FEE2E2;
        color: #991B1B
    }

    .evt-water {
        background: #E0F2FE;
        color: #0369A1
    }

    .evt-eng1 {
        background: #FDF4FF;
        color: #86198F
    }

    .cal-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 14px;
        border-top: 1px solid var(--bdr)
    }

    .leg-item {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        color: var(--ts)
    }

    .leg-dot {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex-shrink: 0
    }

    .evt-detail-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, .5);
        z-index: 200;
        display: flex;
        align-items: flex-end;
        justify-content: center
    }

    .evt-detail-card {
        background: #fff;
        border-radius: 16px 16px 0 0;
        padding: 20px;
        width: 100%;
        max-width: 420px;
        max-height: 80vh;
        overflow-y: auto
    }

    .evt-detail-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 4px
    }

    .evt-detail-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 0;
        border-bottom: .5px solid var(--bdr);
        font-size: 13px
    }

    .evt-detail-row:last-child {
        border: none
    }

    .evt-detail-lbl {
        color: var(--ts);
        flex-shrink: 0;
        width: 70px
    }

    .evt-detail-val {
        font-weight: 500;
        flex: 1
    }

    .add-evt-form {
        background: var(--s0);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px
    }

    .list-view {
        padding: 0 2px
    }

    .list-month {
        font-size: 11px;
        font-weight: 600;
        color: var(--tm);
        letter-spacing: .8px;
        text-transform: uppercase;
        padding: 10px 0 6px;
        margin-top: 6px
    }

    .list-evt {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: #fff;
        border-radius: 10px;
        border: 1px solid var(--bdr);
        margin-bottom: 6px;
        cursor: pointer
    }

    .list-evt-date {
        text-align: center;
        flex-shrink: 0;
        width: 36px
    }

    .list-evt-day {
        font-size: 18px;
        font-weight: 700;
        color: #1A2B5C;
        line-height: 1
    }

    .list-evt-month {
        font-size: 9px;
        color: var(--tm);
        text-transform: uppercase;
        letter-spacing: .5px
    }

    .list-evt-body {
        flex: 1;
        min-width: 0
    }

    .list-evt-name {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
    }

    .list-evt-meta {
        font-size: 11px;
        color: var(--ts);
        margin-top: 2px
    }

    .list-evt-pill {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 20px;
        flex-shrink: 0
    }

    .view-toggle {
        display: flex;
        gap: 6px;
        margin-bottom: 12px
    }

    .vt-btn {
        flex: 1;
        padding: 8px;
        border-radius: 9px;
        border: 1px solid var(--bdr);
        background: #fff;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        font-family: var(--font);
        color: var(--ts)
    }

    .vt-btn.active {
        background: #1A2B5C;
        color: #fff;
        border-color: #1A2B5C
    }
    </style>

    function calPrev() {
        calMonth--;
        if (calMonth < 0) {
            calMonth = 11;
            calYear--;
        }
        rCalendar();
    }
    function calNext() {
        calMonth++;
        if (calMonth > 11) {
            calMonth = 0;
            calYear++;
        }
        rCalendar();
    }
    function calToday() {
        calYear = new Date().getFullYear();

    function calSetView(v) {
        calView = v;
        document.getElementById('vt-month')?.classList.toggle('active', v === 'month');
        document.getElementById('vt-list')?.classList.toggle('active', v === 'list');
        rCalendar();

    function updateCalLabel() {
        const el = document.getElementById('cal-month-label');
        if (el)
            el.textContent = MONTHS[calMonth] + ' ' + calYear;
    }

    function evtsForMonth(y, m) {
        return COURSE_EVENTS.filter(e => {
            const d = new Date(e.date);
            return d.getFullYear() === y && d.getMonth() === m;
        });
    }

    function evtsForDay(y, m, d) {
        return COURSE_EVENTS.filter(e => {
            const start = new Date(e.date),
                end = new Date(e.endDate || e.date);
            const check = new Date(y, m, d);
            return check >= start && check <= end;
        });
    }

    function rCalendar() {
        updateCalLabel();
        const el = document.getElementById('v-calendar');
        if (!el)
            return;
        const today = new Date();
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const daysInPrev = new Date(calYear, calMonth, 0).getDate();
        const isAdmin = document.getElementById('uav')?.textContent === 'BS' && document.getElementById('unm')?.textContent === 'Brandon';

        if (calView === 'list') {
            const upcoming = COURSE_EVENTS.filter(e => new Date(e.date) >= new Date(today.getFullYear(), today.getMonth(), 1)).sort((a, b) => new Date(a.date) - new Date(b.date));
            let lastMonth = '';
            const listHTML = upcoming.map(e => {
                const d = new Date(e.date);
                const mLabel = MONTHS[d.getMonth()] + ' ' + d.getFullYear();
                const prefix = mLabel !== lastMonth ? (lastMonth = mLabel, `<div class="list-month">${mLabel}</div>`) : '';
                return `${prefix}<div class="list-evt" onclick="openEvt(${e.id})">
                        <div class="list-evt-date"><div class="list-evt-day">${d.getDate()}</div><div class="list-evt-month">${MONTHS_S[d.getMonth()]}</div></div>
                        <div class="list-evt-body"><div class="list-evt-name">${e.title}</div><div class="list-evt-meta">${e.provider} · ${e.location} · ${e.duration}</div></div>
                        <span class="list-evt-pill ${EVT_COLORS[e.type]}">${EVT_LABELS[e.type]}</span>
                      </div>`;
            }).join('');
            el.querySelector('#cal-body').innerHTML = `<div class="list-view">${listHTML || '<div class="empty">No upcoming courses found.</div>'}</div>`;
            return;
        }

        // Month view
        let cells = '';
        // Prev month days
        for (let i = firstDay - 1; i >= 0; i--) {
            cells += `<div class="cal-cell other-month"><div class="cal-date">${daysInPrev - i}</div></div>`;
        }
        // This month days
        for (let d = 1; d <= daysInMonth; d++) {
            const isToday = d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
            const dayEvts = evtsForDay(calYear, calMonth, d);
            const evtDots = dayEvts.slice(0, 2).map(e => `<div class="cal-evt ${EVT_COLORS[e.type]}">${EVT_LABELS[e.type]}</div>`).join('');
            const more = dayEvts.length > 2 ? `<div style="font-size:9px;color:var(--tm)">+${dayEvts.length - 2} more</div>` : '';
            cells += `<div class="cal-cell${isToday ? ' today' : ''}${dayEvts.length ? ' has-event' : ''}" onclick="calDayClick(${calYear},${calMonth},${d})">
                  <div class="cal-date">${d}</div>${evtDots}${more}
                </div>`;
        }
        // Next month fill
        const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
        for (let d = 1; d <= totalCells - (firstDay + daysInMonth); d++) {
            cells += `<div class="cal-cell other-month"><div class="cal-date">${d}</div></div>`;
        }

        el.querySelector('#cal-body').innerHTML = `
            <div class="cal-days-hdr">${DAYS.map(d => `<div class="cal-day-lbl">${d}</div>`).join('')}</div>
            <div class="cal-grid">${cells}</div>
            <div class="cal-legend">
              ${Object.entries(EVT_LABELS).map(([k, v]) => `<div class="leg-item"><div class="leg-dot ${EVT_COLORS[k]}"></div>${v}</div>`).join('')}
            </div>`;
    }

        else if (evts.length > 1) {
            const list = evts.map(e => `<div class="list-evt" onclick="openEvt(${e.id})" style="margin-bottom:6px"><div class="list-evt-body"><div class="list-evt-name">${e.title}</div><div class="list-evt-meta">${e.provider}</div></div><span class="list-evt-pill ${EVT_COLORS[e.type]}">${EVT_LABELS[e.type]}</span></div>`).join('');
            showEvtOverlay(`<div class="evt-detail-title" style="margin-bottom:12px">${d} ${MONTHS[m]}</div>${list}`);
        }
    }

    async function sbFetch(path, method='GET', body=null) {
        const headers = {
            'apikey': SB_KEY,
            'Authorization': 'Bearer ' + SB_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation',
            'X-Client-Info': 'seafarer-portal/1.0'
        };
        const opts = {
            method,
            headers
        };
        if (body)
            opts.body = JSON.stringify(body);
        try {
            const r = await fetch(SB_URL + '/rest/v1/' + path, opts);
            if (!r.ok) {
                const e = await r.text();
                console.error('Supabase error:', r.status, e);
                return null;
            }
            const t = await r.text();
            return t ? JSON.parse(t) : null;
        } catch (ex) {
            console.error('Fetch error:', ex);
            throw ex;
        }
    }

    async function doLogin() {
        if (_loginBusy)
            return;
        _loginBusy = true;
        const e = document.getElementById('le').value.trim().toLowerCase();
        const p = document.getElementById('lp').value;
        const err = document.getElementById('lerr');
        const lbtn = document.getElementById('login-btn');
        if (!e || !p) {
            err.textContent = 'Please enter your email and password.';
            err.style.display = 'block';
            return;
        }
        if (lbtn) {
            lbtn.textContent = 'Signing in...';
            lbtn.disabled = true;
        }
        err.style.display = 'none';
        const loadingEl = document.getElementById('login-loading');
        if (loadingEl)
            loadingEl.style.display = 'block';

        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 10000));

        try {
            const student = await Promise.race([dbGetStudent(e), timeout]);
            if (!student) {
                err.textContent = 'Email not found. Please check and try again.';
                err.style.display = 'block';
                if (lbtn) {
                    lbtn.textContent = 'Sign in';
                    lbtn.disabled = false;
                }
                _loginBusy = false;
                return;
            }
            if (student.password !== p) {
                err.textContent = 'Incorrect password. Please try again.';
                err.style.display = 'block';
                if (lbtn) {
                    lbtn.textContent = 'Sign in';
                    lbtn.disabled = false;
                }
                _loginBusy = false;
                return;
            }
            err.style.display = 'none';
            _currentUser = student;
            const ini = student.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
            const loadEl = document.getElementById('login-loading');
            if (loadEl)
                loadEl.style.display = 'none';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('portal').style.display = 'flex';
            document.getElementById('unm').textContent = student.name.split(' ')[0];
            document.getElementById('uav').textContent = ini;
            const isAdmin = student.email === ADMIN_EMAIL || student.notes === 'Admin';
            document.getElementById('uav').style.background = isAdmin ? '#1A2B5C' : '#C0392B';
            if (isAdmin) {
                STUDENTS = await dbGetStudents() || [];
                REFS = await dbGetReferrals() || [];
                rAdmin();
            } else {
                rStudentFromDB(student);
            }
        } catch (ex) {
            console.error('Login error:', ex);
            if (ex.message === 'timeout') {
                err.textContent = 'Connection timed out. Check your internet and try again.';
            } else {
                err.textContent = 'Could not connect to database. Try again in a moment.';
            }
            err.style.display = 'block';
            if (lbtn) {
                lbtn.textContent = 'Sign in';
                lbtn.disabled = false;
            }
            _loginBusy = false;
        }
    }

    async function hDoc(input) {
        if (input.files && input.files[0]) {

                name: f.name,
                type: f.type.includes('pdf') ? 'pdf' : 'image'
            };
            if (_currentUser && _currentUser.id) {
                doc.student_id = _currentUser.id;
                const saved = await dbAddDoc(doc);
                if (saved) {
                    const newDoc = Array.isArray(saved) ? saved[0] : saved;
                    _DOCS.push(newDoc);
                    document.getElementById('dl').innerHTML = rDL(_DOCS);
                    return;
                }
            }
            _DOCS.push({
                ...doc,
                id: Date.now(),
                uploaded_at: new Date().toISOString()
            });
            document.getElementById('dl').innerHTML = rDL(_DOCS);
        }
    }

    async function saveNewStudent() {
        const name = document.getElementById('ns-name').value.trim();
        const email = document.getElementById('ns-email').value.trim().toLowerCase();
        const phone = document.getElementById('ns-phone').value.trim();
        const pass = document.getElementById('ns-pass').value.trim();
        const track = document.getElementById('ns-track').value;
        const visa = document.getElementById('ns-visa').value.trim() || 'Not started';
        const errEl = document.getElementById('ns-err');

        if (!name || !email || !phone || !pass) {
            errEl.style.display = 'block';
            return;
        }
        errEl.style.display = 'none';

        const ini = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

        STUDENTS.unshift({
            name,
            email,
            track,
            done: 0,
            active: 0,
            pending: 7,
            total: 7,
            visa,
            vs: 0,
            phone,
            notes: '',
            pops: 0,
            docs: [],
            ini
        });

        USERS[email] = {
            pass,
            role: 'student',
            name,
            ini,
            phone
        };

        const saved = document.getElementById('ns-saved');
        saved.style.display = 'block';

        const waMsg = `Hi ${name.split(' ')[0]}! Your Seafarer Portal account is ready ⚓

        Login here: https://seafarerssa.github.io/seafarer-portals

        Email: ${email}
        Password: ${pass}

        Add it to your phone home screen so it works like an app!

        — Brandon @ Seafarer Maritime`;

        setTimeout(() => {
            document.getElementById('s-list').innerHTML = rSL();
            const lbl = document.getElementById('student-count-lbl');
            if (lbl)

            hideAddStudent();
            const waBtn = document.createElement('div');
            waBtn.innerHTML = `<div class="card" style="border-left:4px solid #25D366;margin-bottom:10px"><div style="font-size:13px;font-weight:500;margin-bottom:6px"><i class="ti ti-circle-check" style="color:var(--tsu)" aria-hidden="true"></i> ${name} added successfully!</div><div style="font-size:12px;color:var(--ts);margin-bottom:10px">Send login details to ${phone} on WhatsApp now:</div><a href="${wa(phone, waMsg)}" target="_blank" class="btn gn full" style="padding:11px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none"><i class="ti ti-brand-whatsapp" style="font-size:14px" aria-hidden="true"></i> Send login details via WhatsApp</a></div>`;
            document.getElementById('s-list').insertBefore(waBtn.firstChild, document.getElementById('s-list').firstChild);
        }, 1000);
    }

        document.getElementById('ql-a').innerHTML = rQL();
    }
    function shAQ() {
        _nqd = {
            title: '',
            topic: '',
            qs: []
        };
        document.getElementById('aq-area').innerHTML = `<div class="card" style="margin-bottom:12px"><div class="fg"><label>Quiz title</label><input id="nq-t" placeholder="e.g. Knots and Splicing" oninput="_nqd.title=this.value"/></div><div class="fg"><label>Topic</label><input id="nq-tp" placeholder="e.g. Deck Operations" oninput="_nqd.topic=this.value"/></div><div class="shdr">Questions <button class="btn sm" style="margin-left:8px" onclick="aQQ()"><i class="ti ti-plus" style="font-size:11px" aria-hidden="true"></i> Add question</button></div><div id="nq-qs"></div><div class="errmsg" id="nq-err">Add a title and at least one question.</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn nv" onclick="svQ()">Save quiz</button><button class="btn" onclick="document.getElementById('aq-area').innerHTML=''">Cancel</button></div></div>`;
    }
    function aQQ() {
        const idx = _nqd.qs.length;
        _nqd.qs.push({
            q: '',
            opts: ['', '', '', ''],
            ans: 0
        });
        const d = document.createElement('div');
        d.className = 'aqf';
        d.innerHTML = `<div style="font-size:12px;font-weight:500;color:var(--ts);margin-bottom:8px">Question ${idx + 1}</div><textarea placeholder="Type your question here..." oninput="_nqd.qs[${idx}].q=this.value"></textarea>${[0, 1, 2, 3].map(i => `<input placeholder="Option ${i + 1}${i === 0 ? ' (correct answer)' : ''}" oninput="_nqd.qs[${idx}].opts[${i}]=this.value"/>`).join('')}`;
        document.getElementById('nq-qs').appendChild(d);
    }
    function svQ() {
        if (!_nqd.title || !_nqd.qs.length || !_nqd.qs[0].q) {
            document.getElementById('nq-err').style.display = 'block';
            return;
        }
        QZ.push({
            id: Date.now(),
            title: _nqd.title,
            topic: _nqd.topic || 'General',
            added: td(),
            attempts: [],
            qs: _nqd.qs.filter(q => q.q).map(q => ({
                ...q,
                ans: 0
            }))
        });
        document.getElementById('aq-area').innerHTML = '';
        document.getElementById('ql-a').innerHTML = rQL();
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none')
            doLogin();
    });
    </script>
</body>
</html>
